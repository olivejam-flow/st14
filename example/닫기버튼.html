<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>닫기 버튼</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      margin: 50px;
    }

    .btnClose {
      background-color: transparent;
      border: 0;
      outline: none;
      /* focus가 되었을 때 테두리 안보이게 제거 */
      background-color: #ccc;
      color: transparent;
      text-indent: 150%;
      white-space: nowrap;
      overflow: hidden;
      line-height: 0;
      cursor: pointer;
    }

    .btnClose .icon.icoClos {
      background-color: #ff6;
      display: block;
      position: relative;
      width: 24px;
      height: 24px;
      transform: rotate(45deg);
      margin: 0 auto;
    }

    .btnClose .icon.icoClos:before {
      content: "";
      position: absolute;
      top: 0;
      right: 50%;
      transform: translateX(50%);
      width: 2px;
      height: 100%;
      background-color: #000;
      transition: all 0.3s ease-out;
    }

    .btnClose .icon.icoClos:after {
      content: "";
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      width: 100%;
      height: 2px;
      background-color: #000;
      transition: all 0.3s ease-out;
    }
  </style>
</head>

<body>
  <button type="button" class="btnClose">
    <i class="icon icoClos">
    </i>
    닫기
  </button>
</body>

</html>
